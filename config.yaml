# === 检索配置 ===
categories: ["cs.CV", "cs.LG", "cs.AI"]

# 搜索关键词（简化为 5 个核心关键词）
keywords:
  - "open-vocabulary"
  - "vision transformer"
  - "vision-language"
  - "training-free"
  - "zero-shot"

# 排除不相关的论文
exclude_keywords:
  - "Large Language Model"
  - "LLM"
  - "Generative AI"
  - "ChatGPT"
  - "prompt"

logic: "AND"                 # categories 与 keywords 之间 AND（既在CV领域，又匹配关键词）
max_results: 50             # 增加单页结果上限
sort_by: "lastUpdatedDate"   # 按更新时间排序
sort_order: "descending"

# === 输出语言 ===
lang: "both"                 # zh / en / both

# === 摘要生成 ===
summary:
  mode: "llm"                # none / heuristic / llm
  scope: "both"              # tldr / full / both

# === LLM 配置（SiliconFlow） ===
llm:
  provider: "openai-compatible"
  base_url: "https://api.siliconflow.cn"
  model: "Qwen/Qwen2.5-7B-Instruct"
  api_key_env: "OPENAI_COMPAT_API_KEY"

  system_prompt_en: |
    You are a senior paper-reading assistant. Based on the given metadata and abstract,
    write ONE concise paragraph in English covering: research motivation, main method,
    and key experimental findings. Be objective and specific; avoid marketing language.
    Preserve any provided links, but do NOT repeat them in the paragraph.

  system_prompt_zh: |
    你是资深论文阅读助手。基于给定的论文元信息与摘要，用中文写「一段」简洁的总结，
    包含研究动机、核心方法与关键实验结果。保持客观、术语准确；避免营销式表述。

# === 中文翻译设置 ===
translate:
  enabled: true
  lang: "zh"
  fields: ["title", "summary"]

# === 邮件发送（QQ 邮箱） ===
email:
  enabled: true
  subject: "[arXiv CV] Daily Digest"
  smtp_server: "smtp.qq.com"
  smtp_port: 465
  smtp_pass_env: "SMTP_PASS"
  tls: "ssl"
  debug: false
  detail: "full"
  max_items: 20             # 邮件中只显示最近 20 篇
  attach_md: true
  attach_pdf: false

# === GitHub Pages 站点 ===
site:
  enabled: true
  dir: "docs"
  title: "arXiv 论文速递 - CV"
  keep_runs: 1024
  theme: "light"
  accent: "#2563eb"

# === 新鲜度 & 去重 ===
freshness:
  since_days: 3                # 【修复】最近 3 天内更新/提交的论文
  unique_only: true
  state_path: ".state/seen_cv.json"
  fallback_when_empty: false  # 今天无新增时不回退展示旧论文

# === 抓取配置 ===
scrape:
  html: true
  pdf_if_missing: true
  pdf_first_page: false
  timeout: 10
