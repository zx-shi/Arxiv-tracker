# === AI 领域配置 ===
categories: ["cs.AI", "cs.CL", "cs.LG"]

keywords:
  - "large language model"
  - "LLM"
  - "reasoning"
  - "instruction tuning"
  - "multimodal"
  - "vision language model"
  - "transformer"
  - "attention mechanism"
  - "training efficiency"

exclude_keywords:
  - "medical image"
  - "remote sensing"
  - "satellite"
  - "radiology"

logic: "OR"                  # AI 领域更广，用 OR 匹配任一关键词
max_results: 50
sort_by: "lastUpdatedDate"
sort_order: "descending"

lang: "both"

summary:
  mode: "llm"
  scope: "both"

llm:
  provider: "openai-compatible"
  base_url: "https://api.siliconflow.cn"
  model: "Qwen/Qwen2.5-7B-Instruct"
  api_key_env: "OPENAI_COMPAT_API_KEY"
  system_prompt_en: |
    You are a senior paper-reading assistant. Based on the given metadata and abstract,
    write ONE concise paragraph in English covering: research motivation, main method,
    and key experimental findings. Be objective and specific; avoid marketing language.
  system_prompt_zh: |
    你是资深论文阅读助手。基于给定的论文元信息与摘要，用中文写「一段」简洁的总结，
    包含研究动机、核心方法与关键实验结果。保持客观、术语准确。

translate:
  enabled: true
  lang: "zh"
  fields: ["title", "summary"]

email:
  enabled: true
  subject: "[arXiv AI] Daily Digest"
  smtp_server: "smtp.163.com"
  smtp_port: 465
  smtp_pass_env: "SMTP_PASS"
  tls: "ssl"
  debug: false
  detail: "full"
  max_items: 20
  attach_md: true
  attach_pdf: false

site:
  enabled: true
  dir: "docs_ai"
  title: "arXiv 论文速递 - AI"
  keep_runs: 1024
  theme: "light"
  accent: "#7c3aed"

freshness:
  since_days: 7                # 优化：最近 7 天内更新/提交的论文
  unique_only: false           # 临时关闭去重，测试抓取
  state_path: ".state/seen_ai.json"
  fallback_when_empty: false

scrape:
  html: true
  pdf_if_missing: true
  pdf_first_page: false
  timeout: 10
