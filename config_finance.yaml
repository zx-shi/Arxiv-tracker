# === 金融/经济领域配置 ===
categories: ["econ.GN", "econ.EM", "econ.TH", "q-fin.GN", "q-fin.ST", "q-fin.CP", "q-fin.TR", "q-fin.PM"]

keywords:
  - "machine learning"
  - "neural network"
  - "time series"
  - "financial forecasting"
  - "market microstructure"
  - "trading strategy"
  - "quantitative"
  - "asset pricing"
  - "risk management"
  - "deep learning"
  - "portfolio optimization"

exclude_keywords:
  - "computer vision"
  - "image processing"
  - "natural language"

logic: "OR"
max_results: 30
sort_by: "lastUpdatedDate"
sort_order: "descending"

lang: "both"

summary:
  mode: "llm"
  scope: "both"

llm:
  provider: "openai-compatible"
  base_url: "https://api.siliconflow.cn"
  model: "Qwen/Qwen2.5-7B-Instruct"
  api_key_env: "OPENAI_COMPAT_API_KEY"
  system_prompt_en: |
    You are a senior paper-reading assistant. Based on the given metadata and abstract,
    write ONE concise paragraph in English covering: research motivation, main method,
    and key experimental findings. Be objective and specific; avoid marketing language.
  system_prompt_zh: |
    你是资深论文阅读助手。基于给定的论文元信息与摘要，用中文写「一段」简洁的总结，
    包含研究动机、核心方法与关键实验结果。保持客观、术语准确。

translate:
  enabled: true
  lang: "zh"
  fields: ["title", "summary"]

email:
  enabled: true
  subject: "[arXiv Finance] Daily Digest"
  smtp_server: "smtp.qq.com"
  smtp_port: 465
  smtp_pass_env: "SMTP_PASS"
  tls: "ssl"
  debug: false
  detail: "full"
  max_items: 15
  attach_md: true
  attach_pdf: false

site:
  enabled: true
  dir: "docs_finance"
  title: "arXiv 论文速递 - Finance"
  keep_runs: 1024
  theme: "light"
  accent: "#dc2626"

freshness:
  since_days: 7                 # 金融领域论文较少，保持 7 天
  unique_only: false           # 临时关闭去重，测试抓取
  state_path: ".state/seen_finance.json"
  fallback_when_empty: false

scrape:
  html: true
  pdf_if_missing: true
  pdf_first_page: false
  timeout: 10
